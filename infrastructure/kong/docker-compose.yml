# Kong API Gateway Configuration
# Purpose: Route requests to microservices, enforce rate limiting, handle authentication

version: '3.8'

services:
  kong-database:
    image: postgres:15-alpine
    container_name: kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - enav-network

  kong-migration:
    image: kong:3.4-alpine
    container_name: kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    depends_on:
      - kong-database
    networks:
      - enav-network

  kong:
    image: kong:3.4-alpine
    container_name: kong-api-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"  # HTTP
      - "8443:8443"  # HTTPS
      - "8001:8001"  # Admin API
    depends_on:
      - kong-migration
    networks:
      - enav-network

  konga:
    image: pantsel/konga:latest
    container_name: konga-admin-ui
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga
    ports:
      - "1337:1337"
    depends_on:
      - kong-database
    networks:
      - enav-network

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - kong
    networks:
      - enav-network

  service-management:
    build:
      context: ../services/service-management
      dockerfile: Dockerfile
    container_name: service-management
    environment:
      DATABASE_URL: ${DATABASE_URL}
      USER_SERVICE_URL: http://user-service:3001
      NODE_ENV: development
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - kong
      - user-service
    networks:
      - enav-network

volumes:
  kong_data:

networks:
  enav-network:
    driver: bridge
